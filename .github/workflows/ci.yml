name: ci
on:
  push:
  pull_request:

jobs:
  build-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Verify pinned raw inputs
        run: make fetch
      - name: Build dataset
        run: make build
      - name: Validate (P0 suite)
        run: make validate
      - name: Tests
        run: make test
