[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sinew"
version = "0.2.0"
description = "An open, sourced Bible connection-graph dataset (text + canonical IDs + versification + cross-references)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "CC-BY-4.0" }
authors = [{ name = "Lucas" }]
keywords = ["bible", "cross-references", "dataset", "versification", "openbible"]
dependencies = ["pyarrow>=15"]

[project.optional-dependencies]
dev = ["pytest>=8"]
mcp = ["mcp>=1.2"]                       # optional: only needed to run the MCP server (Python >=3.10)
embed = ["sentence-transformers>=3", "scikit-learn>=1.3", "numpy>=1.24"]  # optional: Tier-3 meaning layer (`make embed`)
publish = ["huggingface_hub>=0.23"]     # optional: publish to the HF Hub (`scripts/publish_hf.py`)

[project.scripts]
sinew-mcp = "sinew.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sinew = ["viz/index.html", "viz/meaning.html", "viz/sinew.viz.js",
         "viz/meaning.viz.js", "viz/vendor/*.js", "viz/data/meaning.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
