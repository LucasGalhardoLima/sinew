[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sinew"
version = "0.1.0"
description = "An open, sourced Bible connection-graph dataset (text + canonical IDs + versification + cross-references)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "CC-BY-4.0" }
authors = [{ name = "Lucas" }]
keywords = ["bible", "cross-references", "dataset", "versification", "openbible"]
dependencies = ["pyarrow>=15"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
